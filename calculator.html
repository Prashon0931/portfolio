<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #171716;
        }

        .calculator {
            width: 405px;
            padding: 26px 24px 27px;
            background: #242321;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        /* DISPLAY */

        .display {
            width: 100%;
            height: 143px;
            margin-bottom: 21px;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            padding: 20px;

            background: #c8d2a2;
            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                inset 0 3px 6px rgba(0, 0, 0, 0.15),
                0 3px 4px rgba(0, 0, 0, 0.25);
        }

        #display {
            color: #17342e;
            font-size: 42px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BUTTON AREA */

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
        }

        button {
            height: 76px;

            border: none;
            border-radius: 14px;

            background: #3b3a38;
            color: #f2f2f0;

            font-size: 22px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 4px 0 #1c1b19;

            transition:
                background 0.1s,
                transform 0.1s,
                box-shadow 0.1s;
        }

        button:hover {
            background: #474643;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1c1b19;
        }

        /* C, +/-, BACKSPACE */

        .function {
            background: #51504d;
        }

        .function:hover {
            background: #5d5b58;
        }

        /* OPERATORS */

        .operator {
            background: #bd6818;
        }

        .operator:hover {
            background: #cc7521;
        }

        /* EQUALS */

        .equals {
            background: #426b53;
        }

        .equals:hover {
            background: #4e795e;
        }

        /* ZERO BUTTON */

        .zero {
            grid-column: span 2;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .calculator {
                width: 92%;
                max-width: 405px;
                padding: 20px;
                border-radius: 25px;
            }

            .display {
                height: 125px;
            }

            button {
                height: 65px;
            }

            #display {
                font-size: 36px;
            }

            .buttons {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <!-- DISPLAY -->

        <div class="display">
            <span id="display">0</span>
        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <!-- ROW 1 -->

            <button class="function" onclick="clearCalculator()">C</button>

            <button class="function" onclick="toggleSign()">+/-</button>

            <button class="function" onclick="deleteNumber()">←</button>

            <button class="operator" onclick="selectOperator('/')">÷</button>


            <!-- ROW 2 -->

            <button onclick="inputNumber('7')">7</button>

            <button onclick="inputNumber('8')">8</button>

            <button onclick="inputNumber('9')">9</button>

            <button class="operator" onclick="selectOperator('*')">×</button>


            <!-- ROW 3 -->

            <button onclick="inputNumber('4')">4</button>

            <button onclick="inputNumber('5')">5</button>

            <button onclick="inputNumber('6')">6</button>

            <button class="operator" onclick="selectOperator('-')">−</button>


            <!-- ROW 4 -->

            <button onclick="inputNumber('1')">1</button>

            <button onclick="inputNumber('2')">2</button>

            <button onclick="inputNumber('3')">3</button>

            <button class="operator" onclick="selectOperator('+')">+</button>


            <!-- ROW 5 -->

            <button class="zero" onclick="inputNumber('0')">0</button>

            <button onclick="inputDecimal()">.</button>

            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>


    <script>

        /* ==========================================
           CALCULATOR VARIABLES
        ========================================== */

        let currentValue = "0";

        let storedValue = null;

        let selectedOperator = null;

        let waitingForNumber = false;

        let justCalculated = false;


        const display = document.getElementById("display");


        /* ==========================================
           UPDATE DISPLAY
        ========================================== */

        function updateDisplay() {

            display.textContent = currentValue;

        }


        /* ==========================================
           NUMBER INPUT
        ========================================== */

        function inputNumber(number) {

            /*
                If we just selected an operator,
                start entering the new number.
            */

            if (waitingForNumber) {

                currentValue = number;

                waitingForNumber = false;

            }

            /*
                If we just pressed "=" and then
                press a number, start a new calculation.
            */

            else if (justCalculated) {

                currentValue = number;

                storedValue = null;

                selectedOperator = null;

                justCalculated = false;

            }

            /*
                Prevent multiple leading zeros.
            */

            else if (currentValue === "0") {

                currentValue = number;

            }

            /*
                Normal number entry.
            */

            else {

                currentValue += number;

            }

            updateDisplay();
        }


        /* ==========================================
           DECIMAL
        ========================================== */

        function inputDecimal() {

            if (waitingForNumber) {

                currentValue = "0.";

                waitingForNumber = false;

            }

            else if (justCalculated) {

                currentValue = "0.";

                storedValue = null;

                selectedOperator = null;

                justCalculated = false;

            }

            else if (!currentValue.includes(".")) {

                currentValue += ".";

            }

            updateDisplay();
        }


        /* ==========================================
           OPERATOR
        ========================================== */

        function selectOperator(operator) {

            /*
                Do nothing if the display currently
                contains an error.
            */

            if (currentValue === "Error") {
                return;
            }


            /*
                If the user enters:

                9 + 9

                then presses another operator,
                calculate 9 + 9 first.
            */

            if (
                selectedOperator !== null &&
                !waitingForNumber
            ) {

                calculate();

            }


            /*
                Store the current number.
            */

            storedValue = parseFloat(currentValue);


            /*
                Store the selected operator.
            */

            selectedOperator = operator;


            /*
                Tell the calculator that the next
                number should replace the display.
            */

            waitingForNumber = true;

            justCalculated = false;
        }


        /* ==========================================
           CALCULATE
        ========================================== */

        function calculate() {

            /*
                There is nothing to calculate.
            */

            if (
                selectedOperator === null ||
                storedValue === null
            ) {
                return;
            }


            /*
                Get the second number.
            */

            const secondValue = parseFloat(currentValue);

            let result;


            /*
                PERFORM CALCULATION
            */

            switch (selectedOperator) {

                case "+":

                    result = storedValue + secondValue;

                    break;


                case "-":

                    result = storedValue - secondValue;

                    break;


                case "*":

                    result = storedValue * secondValue;

                    break;


                case "/":

                    if (secondValue === 0) {

                        currentValue = "Error";

                        storedValue = null;

                        selectedOperator = null;

                        waitingForNumber = true;

                        justCalculated = true;

                        updateDisplay();

                        return;
                    }

                    result = storedValue / secondValue;

                    break;
            }


            /*
                Remove unnecessary decimal digits.
            */

            if (Number.isInteger(result)) {

                currentValue = String(result);

            } else {

                currentValue = String(
                    parseFloat(result.toFixed(10))
                );

            }


            /*
                Reset calculation state.
            */

            storedValue = null;

            selectedOperator = null;

            waitingForNumber = false;

            justCalculated = true;


            updateDisplay();
        }


        /* ==========================================
           CLEAR
        ========================================== */

        function clearCalculator() {

            currentValue = "0";

            storedValue = null;

            selectedOperator = null;

            waitingForNumber = false;

            justCalculated = false;

            updateDisplay();
        }


        /* ==========================================
           DELETE
        ========================================== */

        function deleteNumber() {

            if (
                currentValue === "Error" ||
                waitingForNumber ||
                justCalculated
            ) {
                return;
            }


            if (currentValue.length <= 1) {

                currentValue = "0";

            } else {

                currentValue = currentValue.slice(0, -1);

            }


            updateDisplay();
        }


        /* ==========================================
           PLUS / MINUS
        ========================================== */

        function toggleSign() {

            if (
                currentValue === "0" ||
                currentValue === "Error"
            ) {
                return;
            }


            if (currentValue.startsWith("-")) {

                currentValue = currentValue.substring(1);

            } else {

                currentValue = "-" + currentValue;

            }


            updateDisplay();
        }


        /* ==========================================
           KEYBOARD SUPPORT
        ========================================== */

        document.addEventListener("keydown", function(event) {

            const key = event.key;


            /*
                Numbers
            */

            if (key >= "0" && key <= "9") {

                inputNumber(key);

                return;
            }


            /*
                Decimal
            */

            if (key === ".") {

                inputDecimal();

                return;
            }


            /*
                Operators
            */

            if (key === "+") {

                selectOperator("+");

                return;
            }


            if (key === "-") {

                selectOperator("-");

                return;
            }


            if (key === "*") {

                selectOperator("*");

                return;
            }


            if (key === "/") {

                event.preventDefault();

                selectOperator("/");

                return;
            }


            /*
                Equals / Enter
            */

            if (key === "Enter" || key === "=") {

                calculate();

                return;
            }


            /*
                Backspace
            */

            if (key === "Backspace") {

                deleteNumber();

                return;
            }


            /*
                Escape = Clear
            */

            if (key === "Escape") {

                clearCalculator();

                return;
            }

        });

    </script>

</body>
</html>
